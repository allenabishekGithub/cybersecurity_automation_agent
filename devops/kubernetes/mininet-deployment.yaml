apiVersion: apps/v1
kind: Deployment
metadata:
  name: mininet-sim
  labels:
    app.kubernetes.io/name: mininet-sim
    app.kubernetes.io/part-of: rag-agent
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mininet-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mininet-sim
        app.kubernetes.io/part-of: rag-agent
    spec:
      containers:
        - name: mininet-sim
          image: mininet-sim:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
